[project]
name = "api-test-python"
version = "0.1.0"
description = "API testing framework in Python: REST, GraphQL, gRPC, Kafka, PostgreSQL, pytest, Allure"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "API Tester", email = "tester@example.com"}
]
keywords = [
    "api-testing",
    "pytest",
    "grpc",
    "kafka",
    "graphql",
    "sqlalchemy",
    "allure",
]
dependencies = [
    # HTTP клиенты
    "httpx>=0.27.0",
    "requests>=2.31.0",
    
    # GraphQL
    "gql[all]>=3.5.0",
    "graphql-core>=3.2.0",
    
    # gRPC
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    
    # Тестирование
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-rerunfailures>=13.0",
    "pytest-timeout>=2.2.0",
    
    # Отчёты
    "allure-pytest>=2.13.0",
    
    # Валидация данных
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    
    # Генерация данных
    "faker>=22.0.0",
    "polyfactory>=2.14.0",
    
    # Утилиты
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "jsonschema>=4.21.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    
    # Kafka
    "kafka-python>=2.0.2",
    "aiokafka>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "smoke: Quick sanity tests (select with '-m smoke')",
    "regression: Full regression suite",
    "rest: REST API tests",
    "graphql: GraphQL tests", 
    "grpc: gRPC tests",
    "async_test: Async tests",
    "slow: Slow tests (deselect with '-m \"not slow\"')",
    "negative: Negative test cases",
    "crud: CRUD operations",
    "auth: Authentication tests",
    "streaming: Streaming tests",
    "database: Database verification tests",
    "kafka: Kafka messaging tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]





